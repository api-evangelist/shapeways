aid: shapeways
name: Shapeways
description: >-
  Shapeways is an on-demand 3D printing and additive-manufacturing platform that
  turns digital 3D models into physical parts across 12 additive technologies and
  40+ materials, serving over one million customers in 180+ countries as a
  turnkey manufacturing partner for prototyping, production, and lifecycle
  support. Its OAuth 2.0 REST API (base URL https://api.shapeways.com) lets
  applications browse the material catalog, upload and manage 3D models, retrieve
  shipping options, and place and track manufacturing orders. Endpoints are
  versioned with a trailing /v1 path segment; official client libraries are
  published for PHP, Python, JavaScript, Go, and C++.
